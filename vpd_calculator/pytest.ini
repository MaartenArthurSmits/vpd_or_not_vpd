[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers
markers =
    science: numerical and scientific-validation tests (no UI)
    unit: unit tests for plotting, sharing, presets and citation modules
    apptest: Streamlit AppTest interaction tests (no browser)
    e2e: Playwright browser tests against a local Streamlit server
    exports: validation of exported files (CSV, PNG, R script)
